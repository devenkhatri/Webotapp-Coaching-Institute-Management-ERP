services:
  # -----------------------------------------------------------
  # Application Server (PHP 8.3 FPM)
  # -----------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: webotapp-erp:latest
    container_name: webotapp_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-webotapp_erp}
      - DB_USERNAME=${DB_USERNAME:-webotapp}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - public_build:/var/www/html/public/build
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - webotapp_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -----------------------------------------------------------
  # Web Server (Nginx Reverse Proxy & Static Asset Server)
  # -----------------------------------------------------------
  webserver:
    image: nginx:1.27-alpine
    container_name: webotapp_webserver
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - public_build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - webotapp_network
    depends_on:
      - app

  # -----------------------------------------------------------
  # Relational Database (MySQL 8.4 LTS)
  # -----------------------------------------------------------
  db:
    image: mysql:8.4
    container_name: webotapp_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-webotapp_erp}
      MYSQL_USER: ${DB_USERNAME:-webotapp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - webotapp_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # -----------------------------------------------------------
  # Cache & Queue Store (Redis 7)
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: webotapp_redis
    restart: unless-stopped
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - webotapp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # -----------------------------------------------------------
  # Background Queue Worker
  # -----------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    image: webotapp-erp:latest
    container_name: webotapp_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-webotapp_erp}
      - DB_USERNAME=${DB_USERNAME:-webotapp}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - public_build:/var/www/html/public/build
      - storage_data:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
    networks:
      - webotapp_network
    depends_on:
      - app
      - db
      - redis

networks:
  webotapp_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
  bootstrap_cache:
    driver: local
  vendor_data:
    driver: local
  public_build:
    driver: local
